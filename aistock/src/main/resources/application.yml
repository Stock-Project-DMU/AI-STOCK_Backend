spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: aistock
  profiles:
    active: dev
  data:
    web:
      # 관리자 목록 API(admin-trade/admin-user/admin-inquiry)는 @PageableDefault(size=20)만
      # 걸어뒀는데, 이는 요청이 없을 때의 기본값일 뿐 상한이 아니라 ?size=999999999 같은 요청이
      # 그대로 통과해 전체 테이블을 한 번에 긁어올 수 있었다(코드리뷰 반영). 개별 컨트롤러마다
      # 검증을 반복하는 대신 Spring Data Web의 전역 설정으로 요청 가능한 최대 size를 제한한다.
      pageable:
        max-page-size: 100

server:
  port: 8080

jwt:
  secret: ${JWT_SECRET:local-development-secret-key-change-me-please-0123456789}
  access-token-expiration: 3600000
  refresh-token-expiration: 604800000

# 최초 관리자 계정 생성(POST /api/auth/initial-admin) 때 대조할 관리자 인증 코드 — 비어 있으면 최초 관리자를 만들 수 없다
admin:
  signup-code: ${ADMIN_SIGNUP_CODE:}

# CORS 허용 프론트 도메인 - 콤마(,)로 여러 개 지정 가능 (예: http://localhost:3000,https://aistock.example.com)
# 로컬 개발 편의를 위해 기본값은 프론트 로컬 서버(localhost:3000)로 두고,
# 운영 환경 값은 application-prod.yml에서 기본값 없이 환경변수로 강제한다 (하드코딩 금지 원칙).
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}

# 시세 데이터(fix/local-market-data-stable — 외부 시세 데이터 제공사 API 직접 호출(real 모드)을 없앴다).
# 모든 시세는 local-market-data-generator(별도 Python 프로젝트)가 갱신하는 market_data.json에서 읽는다(LocalMarketDataReader).
market-data:
  # market_data.json·price_history.json이 있는 디렉토리. 프로필별 기본값은 application-dev.yml 참고.
  local-path: ${MARKET_DATA_PATH:}
  # 값이 있으면 파일 대신 이 URL(generator의 GET /market-data)로 같은 JSON을 가져온다 — 백엔드가 generator와 파일 시스템을
  # 공유하지 못하는 배포 서버용. 로컬 개발은 비워 두고 파일을 직접 읽는다.
  url: ${MARKET_DATA_URL:}

# 회원가입 이메일 인증코드 발신자 주소 (spring.mail과 별개 커스텀 프로퍼티)
app:
  mail:
    from: ${MAIL_FROM:aistock@example.com}
  # AI 재무설계 상담(feature/ai-planning)에서 쓰는 외부 API 설정.
  # 로컬은 URL만 기본값을 주고 API 키는 빈 문자열 기본값으로 둔다 — 키가 없으면 각 클라이언트가
  # 호출 시점에 EXTERNAL_API_ERROR로 실패하므로, 코드는 완성된 채로 두고 키만 .env로 나중에 채우면 된다.
  gemini:
    api-key: ${GEMINI_API_KEY:}
    # 하이브리드 모델 구성(2026-08-06). 원래 judge=gemini-2.5-flash-lite/answer=gemini-2.5-flash로
    # 정했으나, 이 프로젝트 계정은 "신규 사용자에게 더 이상 제공되지 않음"(404)으로 2.5 세대
    # 전체가 막혀 있어 실제 호출이 안 됐다(실 API 키로 직접 확인, 2026-08-06). 그 다음 시도한
    # "-latest" 별칭(gemini-flash-lite-latest/gemini-flash-latest)은 실제로는 gemini-3.6-flash로
    # 서빙되어 원래 계획보다 3~6배 비쌌다. 최종적으로 실제 호출 가능 + 가장 저렴한 조합인
    # gemini-3.1-flash-lite로 judge/answer 둘 다 통일했다(라이브 테스트 3턴으로 톤·맥락유지·
    # 정확도 확인 완료, 2026-08-06). 버전을 직접 고정해 "-latest" 별칭처럼 Google이 나중에
    # 가리키는 대상을 바꿔 가격이 예고 없이 뛰는 것을 막는다.
    judge-api-url: ${GEMINI_JUDGE_API_URL:https://generativelanguage.googleapis.com/v1beta/models/gemini-3.1-flash-lite:generateContent}
    answer-api-url: ${GEMINI_ANSWER_API_URL:https://generativelanguage.googleapis.com/v1beta/models/gemini-3.1-flash-lite:generateContent}
  dart:
    api-key: ${DART_API_KEY:}
    api-url: ${DART_API_URL:https://opendart.fss.or.kr/api/fnlttSinglAcntAll.json}
    # 회사명→corp_code 매핑을 위한 DART 전체 회사 목록(zip) 다운로드 엔드포인트.
    corp-code-url: ${DART_CORP_CODE_URL:https://opendart.fss.or.kr/api/corpCode.xml}
  # 네이버 뉴스 검색(NAVER API HUB, NCP 콘솔에서 발급) — 원래 Tavily를 썼으나 AI 자동요약이
  # 동일 검색어로도 결과가 재현되지 않는 문제(2026-08-05 라이브 테스트로 확인)를 겪은 뒤
  # 뉴스 검색 백엔드를 이걸로 교체했다(Tavily 코드·설정은 2026-08-06 완전 삭제). 인증 방식이
  # 옛 openapi.naver.com의 X-Naver-Client-Id/Secret이 아니라 NCP API Gateway 방식
  # (X-NCP-APIGW-API-KEY-ID/KEY)이라 헷갈리기 쉽다 — NaverNewsApiClient 참고.
  naver:
    client-id: ${NAVER_CLIENT_ID:}
    client-secret: ${NAVER_CLIENT_SECRET:}
    api-url: ${NAVER_NEWS_API_URL:https://naverapihub.apigw.ntruss.com/search/v1/news}
