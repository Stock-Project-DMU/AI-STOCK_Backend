spring:
  application:
    name: aistock
  profiles:
    active: dev

server:
  port: 8080

jwt:
  secret: ${JWT_SECRET:local-development-secret-key-change-me-please-0123456789}
  access-token-expiration: 3600000
  refresh-token-expiration: 604800000

# 회원가입 시 role=ADMIN 선택 시 대조할 관리자 가입 코드
admin:
  signup-code: ${ADMIN_SIGNUP_CODE:}

# CORS 허용 프론트 도메인 - 콤마(,)로 여러 개 지정 가능 (예: http://localhost:3000,https://aistock.example.com)
# 로컬 개발 편의를 위해 기본값은 프론트 로컬 서버(localhost:3000)로 두고,
# 운영 환경 값은 application-prod.yml에서 기본값 없이 환경변수로 강제한다 (하드코딩 금지 원칙).
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}

# 회원가입 이메일 인증코드 발신자 주소 (spring.mail과 별개 커스텀 프로퍼티)
app:
  mail:
    from: ${MAIL_FROM:aistock@example.com}
