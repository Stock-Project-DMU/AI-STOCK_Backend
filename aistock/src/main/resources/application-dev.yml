spring:
  datasource:
    url: jdbc:mysql://localhost:3306/aistock?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: ${DB_USERNAME:aistock}
    password: ${DB_PASSWORD:aistock}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}   # 로컬은 인증 없음 → 기본값 빈 문자열
      lettuce:
        pool:                       # Lettuce 커넥션 풀 설정 (RedisConfig가 오토설정으로 읽음)
          max-active: 10
          max-idle: 5
          min-idle: 1
          max-wait: -1ms

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    default-encoding: UTF-8
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

logging:
  level:
    com.teamfp.aistock: debug

# 로컬 개발은 모의투자 서버로 접속한다 (실서버 포트 9443, 모의투자 포트 29443).
ls:
  websocket-url: ${LS_WEBSOCKET_URL:wss://openapi.ls-sec.co.kr:29443/websocket}
