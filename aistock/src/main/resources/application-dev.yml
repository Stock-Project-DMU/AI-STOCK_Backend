spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/aistock?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: ${DB_USERNAME:aistock}
    password: ${DB_PASSWORD:aistock}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}   # 로컬은 인증 없음 → 기본값 빈 문자열
      lettuce:
        pool:                       # Lettuce 커넥션 풀 설정 (RedisConfig가 오토설정으로 읽음)
          max-active: 10
          max-idle: 5
          min-idle: 1
          max-wait: -1ms

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    default-encoding: UTF-8
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

logging:
  level:
    com.teamfp.aistock: debug

# 로컬 개발은 모의투자 서버로 접속한다 (실서버 포트 9443, 모의투자 포트 29443).
# mode 기본값은 mock — CI/테스트 및 외부 시세 데이터 연동이 필요 없는 로컬 개발에서는 MarketDataWebSocketClient 빈
# 자체가 생성되지 않아 MARKET_DATA_APP_KEY/MARKET_DATA_APP_SECRET 없이도 컨텍스트 로딩이 통과한다. 실제 외부 시세 데이터 연동이
# 필요한 로컬 개발자는 .env나 개인 프로필에서 MARKET_DATA_MODE=real로 오버라이드하면 된다.
market-data:
  mode: ${MARKET_DATA_MODE:mock}
  websocket-url: ${MARKET_DATA_WEBSOCKET_URL:wss://openapi.ls-sec.co.kr:29443/websocket}
  # market-data.mode=mock 전용 — 로컬 파일로 시세를 공급할 때 사용할 데이터 디렉토리 경로(프로젝트
  # 상대경로, feature/ls-local-data). 여기서 "프로젝트 상대경로"는 백엔드 프로세스 실행
  # 디렉토리(aistock/) 기준이 아니라, local-market-data-generator(별도 Python 프로젝트)의
  # output/ 폴더를 절대경로로 직접 가리킨다 — 두 프로젝트가 서로 다른 폴더에서 실행되므로
  # generator 쪽 .env(OUTPUT_DIR)도 반드시 이 경로와 같은 절대경로를 가리켜야 한다.
  # LocalMarketDataReader가 이 경로의 market_data.json 단일 파일을 읽는다.
  local-path: ${MARKET_DATA_PATH:C:\AI-STOCK\local-market-data-generator\output}
