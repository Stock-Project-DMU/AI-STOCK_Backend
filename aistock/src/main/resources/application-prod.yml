spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD}    # AWS ElastiCache AUTH 비밀번호
      lettuce:
        pool:                       # Lettuce 커넥션 풀 설정 (RedisConfig가 오토설정으로 읽음)
          max-active: 10
          max-idle: 5
          min-idle: 1
          max-wait: -1ms

logging:
  level:
    com.teamfp.aistock: info

# 로직 검증용으로 임시 추가한 Swagger UI(SwaggerConfig 참고)는 운영 환경에서 인증 없이
# API 문서 전체가 노출되지 않도록 여기서 구조적으로 꺼둔다. SecurityConfig의 permitAll
# 목록에 경로가 남아있어도, 엔드포인트 자체가 비활성화되어 있으면 노출될 수 없다.
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

# 운영 환경은 application.yml의 로컬 기본값을 물려받으면 안 되므로 기본값 없이 필수 환경변수로 강제한다.
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS}

jwt:
  secret: ${JWT_SECRET}
